<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ═══ Bitmask constants (salix5 / ygocdb) ══════════════════════════ */
const T_SPELL=0x2, T_TRAP=0x4, T_NORMAL=0x10, T_EFFECT=0x20, T_FUSION=0x40, T_RITUAL=0x80,
      T_TUNER=0x1000, T_SYNCHRO=0x2000, T_TOKEN=0x4000, T_QUICKPLAY=0x10000, T_CONT=0x20000,
      T_EQUIP=0x40000, T_FIELD=0x80000, T_COUNTER=0x100000, T_XYZ=0x800000,
      T_PENDULUM=0x1000000, T_LINK=0x4000000;

function popcount(n) { let c=0; while(n){c+=n&1;n>>>=1;} return c; }

/* ═══ Lookup maps ══════════════════════════════════════════════════ */
const EN_TYPE_MAP = {
  'Normal Monster':'通常怪獸','Effect Monster':'效果怪獸',
  'Fusion Monster':'融合怪獸','Synchro Monster':'同步怪獸',
  'XYZ Monster':'超量怪獸','Xyz Monster':'超量怪獸',
  'Link Monster':'連結怪獸','Ritual Monster':'儀式怪獸',
  'Pendulum Normal Monster':'靈擺怪獸','Pendulum Effect Monster':'靈擺怪獸',
  'Pendulum Fusion Monster':'靈擺怪獸','Pendulum Synchro Monster':'靈擺怪獸',
  'Pendulum Xyz Monster':'靈擺怪獸','Ritual Effect Monster':'儀式怪獸',
  'Synchro Tuner Monster':'同步怪獸','Synchro Pendulum Effect Monster':'同步怪獸',
  'Spell Card':'魔法卡','Trap Card':'陷阱卡','Token':'衍生物','Skill Card':'技能卡',
};
const EN_ATTR_MAP = {
  'LIGHT':'光','DARK':'闇','FIRE':'炎','WATER':'水','EARTH':'地','WIND':'風','DIVINE':'神',
};
const EN_RACE_MAP = {
  'Dragon':'龍族','Spellcaster':'魔法使族','Zombie':'不死族','Warrior':'戰士族',
  'Beast-Warrior':'獸戰士族','Beast':'獸族','Winged Beast':'鳥獸族','Fiend':'惡魔族',
  'Fairy':'天使族','Insect':'昆蟲族','Dinosaur':'恐龍族','Reptile':'爬蟲類族',
  'Fish':'魚族','Sea Serpent':'海龍族','Aqua':'水族','Thunder':'雷族','Rock':'岩石族',
  'Plant':'植物族','Pyro':'炎族','Machine':'機械族','Cyberse':'電子界族',
  'Psychic':'念動力族','Divine-Beast':'幻神獸族','Creator God':'創造神族',
  'Wyrm':'幻龍族','Illusion':'幻想魔族',
};

const BIT_ATTR = {0x01:'地',0x02:'水',0x04:'炎',0x08:'風',0x10:'光',0x20:'闇',0x40:'神'};
const BIT_RACE = {
  0x1:'戰士族',0x2:'魔法使族',0x4:'天使族',0x8:'惡魔族',
  0x10:'不死族',0x20:'機械族',0x40:'水族',0x80:'炎族',
  0x100:'岩石族',0x200:'鳥獸族',0x400:'植物族',0x800:'昆蟲族',
  0x1000:'雷族',0x2000:'龍族',0x4000:'獸族',0x8000:'獸戰士族',
  0x10000:'恐龍族',0x20000:'魚族',0x40000:'海龍族',0x80000:'爬蟲類族',
  0x100000:'念動力族',0x200000:'幻神獸族',0x400000:'創造神族',
  0x800000:'幻龍族',0x1000000:'電子界族',0x2000000:'幻想魔族',
};

const TYPE_THEME = {
  '通常怪獸': { bg:'rgba(120,88,20,0.35)',  dot:'#C8902A', label:'#E8B84A' },
  '效果怪獸': { bg:'rgba(140,60,10,0.35)',  dot:'#C8601A', label:'#E87A30' },
  '融合怪獸': { bg:'rgba(100,20,140,0.35)', dot:'#9040C0', label:'#B060E0' },
  '同步怪獸': { bg:'rgba(60,90,120,0.35)',  dot:'#5090B0', label:'#70B0D0' },
  '超量怪獸': { bg:'rgba(20,20,60,0.5)',    dot:'#4040A0', label:'#6060C0' },
  '連結怪獸': { bg:'rgba(10,30,100,0.4)',   dot:'#2050C0', label:'#4070E0' },
  '儀式怪獸': { bg:'rgba(20,40,100,0.4)',   dot:'#3060B0', label:'#5080D0' },
  '靈擺怪獸': { bg:'rgba(10,80,30,0.4)',    dot:'#20A040', label:'#40C060' },
  '魔法卡':   { bg:'rgba(0,90,90,0.4)',     dot:'#00A090', label:'#20C0B0' },

  '技能卡':   { bg:'rgba(0,60,100,0.4)',    dot:'#0090C0', label:'#20B0E0' },
};
const DEFAULT_THEME = { bg:'rgba(50,50,60,0.35)', dot:'#606070', label:'#8080A0' };
const TUNER_THEME   = { bg:'rgba(20,100,50,0.3)',  dot:'#30C070', label:'#50D888' };
const BAN_THEME = {
  '禁止':  { bg:'rgba(180,20,20,0.25)',  border:'rgba(200,40,40,0.5)',  color:'#FF6060' },
  '限制':  { bg:'rgba(180,90,10,0.25)',  border:'rgba(200,120,20,0.5)', color:'#FFA040' },
  '準限制':{ bg:'rgba(160,140,10,0.25)', border:'rgba(190,170,20,0.5)', color:'#EED040' },
};

/* Sub-type display colors */
const MONSTER_SUB_COLOR = {
  '通常': TYPE_THEME['通常怪獸'].label,
  '效果': TYPE_THEME['效果怪獸'].label,
  '融合': TYPE_THEME['融合怪獸'].label,
  '同步': TYPE_THEME['同步怪獸'].label,
  '超量': TYPE_THEME['超量怪獸'].label,
  '連結': TYPE_THEME['連結怪獸'].label,
  '儀式': TYPE_THEME['儀式怪獸'].label,
  '靈擺': TYPE_THEME['靈擺怪獸'].label,
};
const SPELL_SUB_COLOR  = { '通常':'#20C0B0','速攻':'#40D8A0','永續':'#30A8C0','裝備':'#60C0D8','場地':'#20D090' };
const TRAP_SUB_COLOR   = { '通常':'#E020A0','永續':'#C040B0','反擊':'#F040C0' };
const TYPE_GROUP_COLOR = { '怪獸':'#E8803A','魔法':'#20C0B0','陷阱':'#E020A0' };

const ATTR_VISUAL = {
  '光': { color:'#F5D060', icon:'☀' },
  '闇': { color:'#A060F0', icon:'🌑' },
  '炎': { color:'#F06030', icon:'🔥' },
  '水': { color:'#40A0F0', icon:'💧' },
  '地': { color:'#90B030', icon:'⛰' },
  '風': { color:'#40D090', icon:'🌀' },
  '神': { color:'#E8D090', icon:'⚡' },
};

const ALL_ATTRS    = ['光','闇','炎','水','地','風','神'];
const TYPE_GROUPS  = ['全部','怪獸','魔法','陷阱'];
const MONSTER_SUBS = ['通常','效果','融合','同步','超量','連結','儀式','靈擺'];
const SPELL_SUBS   = ['通常','速攻','永續','裝備','場地'];
const TRAP_SUBS    = ['通常','永續','反擊'];

/* ═══ Bitmask helpers ═════════════════════════════════════════════ */
function bitAttrZh(n) { return BIT_ATTR[n] || null; }
function bitRaceZh(n) {
  for (const [k,v] of Object.entries(BIT_RACE)) if (n & +k) return v;
  return null;
}
function bitTypeZh(type) {
  if (!type) return null;
  if (type & T_SPELL) return '魔法卡';
  if (type & T_TRAP)  return '陷阱卡';
  if (type & T_TOKEN) return '衍生物';
  if (type & T_LINK)    return '連結怪獸';
  if (type & T_XYZ)     return type & T_PENDULUM ? '靈擺怪獸' : '超量怪獸';
  if (type & T_SYNCHRO) return type & T_PENDULUM ? '靈擺怪獸' : '同步怪獸';
  if (type & T_FUSION)  return type & T_PENDULUM ? '靈擺怪獸' : '融合怪獸';
  if (type & T_RITUAL)  return '儀式怪獸';
  if (type & T_PENDULUM) return '靈擺怪獸';
  if (type & T_NORMAL)  return '通常怪獸';
  return '效果怪獸';
}
function bitTypeLabelsArr(type) {
  if (!type) return [];
  if (type & T_SPELL)  return ['魔法卡'];
  if (type & T_TRAP)   return ['陷阱卡'];
  if (type & T_TOKEN)  return ['衍生物'];
  const labels = [];
  if (type & T_LINK)          labels.push('連結怪獸');
  else if (type & T_XYZ)      labels.push(type & T_PENDULUM ? '靈擺怪獸' : '超量怪獸');
  else if (type & T_SYNCHRO)  labels.push(type & T_PENDULUM ? '靈擺怪獸' : '同步怪獸');
  else if (type & T_FUSION)   labels.push(type & T_PENDULUM ? '靈擺怪獸' : '融合怪獸');
  else if (type & T_RITUAL)   labels.push('儀式怪獸');
  else if (type & T_PENDULUM) labels.push('靈擺怪獸');
  if (type & T_EFFECT)       labels.push('效果怪獸');
  else if (type & T_NORMAL)  labels.push('通常怪獸');
  if (type & T_TUNER)        labels.push('調整');
  return labels.length ? labels : ['效果怪獸'];
}
function bitSubTypeZh(type) {
  if (!type) return null;
  if (type & T_SPELL) {
    if (type & T_QUICKPLAY) return '速攻';
    if (type & T_CONT)      return '永續';
    if (type & T_EQUIP)     return '裝備';
    if (type & T_FIELD)     return '場地';
    return '通常';
  }
  if (type & T_TRAP) {
    if (type & T_COUNTER) return '反擊';
    if (type & T_CONT)    return '永續';
    return '通常';
  }
  return null;
}

/* ═══ Language detection ══════════════════════════════════════════ */
function detectLang(s) {
  if (/[぀-ゟ゠-ヿ]/.test(s)) return 'ja';
  if (/[一-鿿]/.test(s)) return 'zh';
  return 'en';
}

/* ═══ API ══════════════════════════════════════════════════════════ */
async function safeFetch(url, timeoutMs = 8000) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('TIMEOUT');
    return null;
  } finally {
    clearTimeout(tid);
  }
}

function normArray(d) {
  if (!d) return [];
  if (Array.isArray(d)) return d;
  for (const k of ['data','result','results']) if (d[k] && Array.isArray(d[k])) return d[k];
  return [];
}

function parseCard(raw, src) {
  if (!raw) return null;
  const id = raw.id ?? raw.passcode ?? raw.card_id;
  if (!id) return null;

  let nameZh=null, nameJp=null, nameEn=null,
      typeZh=null, attrZh=null, raceZh=null,
      descZh=null, descEn=null, level=null, subTypeZh=null, cid=null,
      typeLabels=null, banStatus=null;

  if (src === 'salix') {
    cid    = raw.cid ? String(raw.cid) : null;
    nameZh = raw.tw_name || null;
    nameEn = raw.ae_name || raw.en_name || null;
    typeZh = typeof raw.type === 'number' ? bitTypeZh(raw.type) : (EN_TYPE_MAP[raw.type] || null);
    attrZh = typeof raw.attribute === 'number' ? bitAttrZh(raw.attribute) : (EN_ATTR_MAP[raw.attribute] || null);
    raceZh = typeof raw.race === 'number' ? bitRaceZh(raw.race) : (EN_RACE_MAP[raw.race] || null);
    descZh = raw.text?.desc || null;
    level  = raw.level ?? null;
    if (typeof raw.type === 'number') {
      subTypeZh  = bitSubTypeZh(raw.type);
      typeLabels = bitTypeLabelsArr(raw.type);
      if ((raw.type & T_LINK) && raw.marker) level = popcount(raw.marker);
    }
  } else if (src === 'cdb') {
    nameJp = raw.jp_name || null;
    nameEn = raw.en_name || null;
    typeZh = typeof raw.type === 'number' ? bitTypeZh(raw.type) : null;
    attrZh = typeof raw.attribute === 'number' ? bitAttrZh(raw.attribute) : null;
    raceZh = typeof raw.race === 'number' ? bitRaceZh(raw.race) : null;
    descZh = raw.text?.tc || raw.text?.sc || null;
    level  = raw.level ?? null;
    if (typeof raw.type === 'number') {
      subTypeZh  = bitSubTypeZh(raw.type);
      typeLabels = bitTypeLabelsArr(raw.type);
      if ((raw.type & T_LINK) && raw.marker) level = popcount(raw.marker);
    }
  } else {
    nameEn = raw.name || null;
    typeZh = EN_TYPE_MAP[raw.type] || null;
    attrZh = EN_ATTR_MAP[raw.attribute] || null;
    raceZh = EN_RACE_MAP[raw.race] || null;
    descEn = raw.desc || null;
    level  = raw.level ?? raw.rank ?? raw.linkval ?? null;
    const BAN_MAP = { 'Forbidden':'禁止', 'Limited':'限制', 'Semi-Limited':'準限制' };
    banStatus = BAN_MAP[raw.banlist_info?.ban_ocg] || null;
  }

  typeLabels = typeLabels || (typeZh ? [typeZh] : []);

  return {
    id: String(id),
    nameZh, nameJp, nameEn, typeZh, attrZh, raceZh,
    atk:       raw.atk !== undefined ? raw.atk : null,
    def:       raw.def !== undefined ? raw.def : null,
    level, subTypeZh, descZh, descEn, cid, typeLabels, banStatus,
    fromJp: src === 'cdb',
  };
}

async function searchCards(query) {
  const lang = detectLang(query);

  if (lang === 'ja') {
    let raw;
    try {
      raw = await safeFetch(`https://ygocdb.com/api/v0/?search=${encodeURIComponent(query)}`);
    } catch (e) {
      if (e.message === 'TIMEOUT') throw new Error('YGOCDB 連線逾時，請稍後再試');
      throw new Error('YGOCDB 連線失敗，請稍後再試');
    }
    if (raw === null) throw new Error('YGOCDB 回應異常，請稍後再試');
    const byId = new Map();
    for (const r of normArray(raw)) {
      const c = parseCard(r, 'cdb');
      if (c && !byId.has(c.id)) byId.set(c.id, c);
    }
    return [...byId.values()].slice(0, 30);
  }

  const isCN = lang === 'zh';
  const sp = isCN ? `cardname=${encodeURIComponent(query)}` : `en_name=${encodeURIComponent(query)}`;
  const [salixRaw, proRaw] = await Promise.all([
    safeFetch(`https://salix5.up.railway.app/query/?${sp}`),
    safeFetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?fname=${encodeURIComponent(query)}&misc=yes`),
  ]);

  const byId = new Map();
  for (const r of normArray(salixRaw)) {
    const c = parseCard(r, 'salix');
    if (c) byId.set(c.id, c);
  }
  for (const r of normArray(proRaw)) {
    const c = parseCard(r, 'ygopro');
    if (!c) continue;
    if (byId.has(c.id)) {
      const ex = byId.get(c.id);
      byId.set(c.id, {
        ...ex,
        nameEn:     ex.nameEn ?? c.nameEn,
        typeZh:     ex.typeZh || c.typeZh,
        typeLabels: ex.typeLabels?.length ? ex.typeLabels : c.typeLabels,
        attrZh:     ex.attrZh ?? c.attrZh,
        raceZh:     ex.raceZh ?? c.raceZh,
        atk: ex.atk ?? c.atk, def: ex.def ?? c.def,
        level:      ex.level ?? c.level,
        descEn:     ex.descEn ?? c.descEn,
        banStatus:  c.banStatus || ex.banStatus,
      });
    } else {
      byId.set(c.id, c);
    }
  }
  return [...byId.values()];
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('無法載入：' + src));
    document.head.appendChild(s);
  });
}

/* ═══ Components ══════════════════════════════════════════════════ */

function CardImg({ id, w, h, radius=8 }) {
  const [state, setState] = useState('loading');
  return (
    <div style={{width:w,height:h,borderRadius:radius,overflow:'hidden',flexShrink:0,background:'rgba(255,255,255,0.04)',position:'relative'}}>
      {state==='loading' && <div className="shimmer" style={{position:'absolute',inset:0}} />}
      {state==='error'
        ? <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'rgba(255,255,255,0.2)'}}>NO IMG</div>
        : <img src={`https://images.ygoprodeck.com/images/cards_small/${id}.jpg`}
            style={{width:'100%',height:'100%',objectFit:'cover',display:state==='ok'?'block':'none'}}
            onLoad={()=>setState('ok')} onError={()=>setState('error')} />
      }
    </div>
  );
}

function TypePill({ typeLabels }) {
  if (!typeLabels?.length) return null;
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
      {typeLabels.map(label => {
        const t = label === '調整' ? TUNER_THEME : (TYPE_THEME[label] || DEFAULT_THEME);
        return (
          <span key={label} style={{
            display:'inline-flex',alignItems:'center',gap:4,
            padding:'2px 9px',borderRadius:99,
            background:t.bg,fontSize:11,fontWeight:600,

function App() {
  const [query, setQuery]       = useState('');
  const [allCards, setAllCards] = useState([]);
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState(null);
  const [searched, setSearched] = useState(false);
  const [sheet, setSheet]     = useState(null);
  const [typeF, setTypeF]     = useState('全部');
  const [attrF, setAttrF]     = useState('全部');
  const [raceF, setRaceF]     = useState('全部');
  const [ocrMsg, setOcrMsg]   = useState(null);
  const [ocrBusy, setOcrBusy] = useState(false);
  const inputRef = useRef(null);
  const ocrRef   = useRef(null);

  const doSearch = useCallback(async (q) => {
    const t = (q ?? query).trim();
    if (!t) return;
    setLoading(true); setError(null); setAllCards([]);
    setSearched(true); setTypeF('全部'); setAttrF('全部'); setRaceF('全部');
    setOcrMsg(null);
    try {
      const res = await searchCards(t);
      setAllCards(res);
      if (res.length > 0) setFiltersOpen(false);
      if (!res.length) setError('找不到符合的卡片');
    } catch { setError('搜尋時發生錯誤'); }
    finally { setLoading(false); }
  }, [query]);

  async function handleOcr(file) {
    setOcrBusy(true);
    setOcrMsg('載入 OCR 引擎（首次約需下載 10–30 MB）…');
    setError(null);
    try {
      if (!window.Tesseract) {
        await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      }
      setOcrMsg('OCR 辨識中… 0%');
      const { data: { text } } = await window.Tesseract.recognize(file, 'jpn', {
        logger: m => {
          if (m.status === 'recognizing text')
            setOcrMsg(`OCR 辨識中… ${Math.round(m.progress*100)}%`);
        },
      });
      const name = text.split('\n').map(l=>l.trim()).filter(Boolean)[0] || text.trim();
      if (!name) { setOcrMsg(null); setError('無法辨識文字，請嘗試更清晰的圖片'); return; }
      setQuery(name);
      setOcrMsg(`辨識結果：「${name}」`);
      doSearch(name);
    } catch (err) {
      setOcrMsg(null); setError(`OCR 失敗：${err.message}`);
    } finally { setOcrBusy(false); }
  }

  const availableAttrs = useMemo(() => {
    const s = new Set(allCards.map(c=>c.attrZh).filter(Boolean));
    return ALL_ATTRS.filter(a => s.has(a));
  }, [allCards]);

  const availableRaces = useMemo(() => {
    const s = new Set(allCards.map(c=>c.raceZh).filter(Boolean));
    return [...s].sort();
  }, [allCards]);

  const availableMonsterSubs = useMemo(() => {
    const s = new Set(
      allCards
        .filter(c => c.typeZh && !['魔法卡','陷阱卡','衍生物','技能卡'].includes(c.typeZh))
        .map(c => c.typeZh?.replace('怪獸',''))
        .filter(Boolean)
    );
    return MONSTER_SUBS.filter(t => s.has(t));
  }, [allCards]);

  const availableSpellSubs = useMemo(() => {
    const s = new Set(allCards.filter(c => c.typeZh==='魔法卡' && c.subTypeZh).map(c => c.subTypeZh));
    return SPELL_SUBS.filter(t => s.has(t));
  }, [allCards]);

  const availableTrapSubs = useMemo(() => {
    const s = new Set(allCards.filter(c => c.typeZh==='陷阱卡' && c.subTypeZh).map(c => c.subTypeZh));
    return TRAP_SUBS.filter(t => s.has(t));
  }, [allCards]);

  const attrOptions  = useMemo(() =>
    searched && availableAttrs.length ? ['全部',...availableAttrs] : ['全部',...ALL_ATTRS],
  [searched, availableAttrs]);
  const raceOptions  = useMemo(() => ['全部',...availableRaces], [availableRaces]);

  const filtered = useMemo(() => allCards.filter(c => {
    const isM = c.typeZh && !['魔法卡','陷阱卡','衍生物','技能卡'].includes(c.typeZh);
    if (typeF==='怪獸' && !isM) return false;
    if (typeF==='魔法' && c.typeZh!=='魔法卡') return false;
    if (typeF==='陷阱' && c.typeZh!=='陷阱卡') return false;
    if (attrF!=='全部' && c.attrZh!==attrF) return false;
    if (raceF!=='全部' && c.raceZh!==raceF) return false;
    return true;
  }), [allCards, typeF, attrF, raceF]);

  const suggestions = ['青眼白龍','黑魔術師','Blue-Eyes','Dark Magician','Dragon'];

  return (
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh',background:'var(--bg-app)'}}>

      {/* ── Header ── */}
      <div style={{
        position:'sticky',top:0,zIndex:200,
        background:'rgba(13,15,23,0.95)',
        backdropFilter:'blur(20px)',
        borderBottom:'1px solid rgba(255,255,255,0.06)',
        paddingBottom:4,
      }}>
        {/* Title */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'16px 16px 10px',gap:8}}>
          <div style={{width:28,height:28,borderRadius:8,background:'linear-gradient(135deg,#8B5E10,#D4A843)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>⬡</div>
          <h1 style={{fontSize:16,fontWeight:700,letterSpacing:'0.06em',color:'#E8C86A'}}>遊戲王卡片查詢</h1>
        </div>

        {/* Search bar */}
        <div style={{padding:'0 12px 10px',display:'flex',gap:8}}>
          <div style={{flex:1,position:'relative',display:'flex',alignItems:'center'}}>
            <span style={{position:'absolute',left:12,color:'rgba(255,255,255,0.25)',fontSize:15,pointerEvents:'none'}}>🔍</span>
            <input
              ref={inputRef}
              value={query}
              onChange={e=>setQuery(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&doSearch()}
              placeholder="輸入卡名（中文／英文／日文）…"
              inputMode="search"
              autoComplete="off"
              autoCorrect="off"
              autoCapitalize="off"
              spellCheck="false"
              style={{
                width:'100%',minHeight:48,padding:'0 12px 0 38px',
                borderRadius:12,border:'1px solid rgba(255,255,255,0.1)',
                background:'rgba(255,255,255,0.06)',

                outline:'none',transition:'border-color 0.2s',
              }}
              onFocus={e=>e.target.style.borderColor='rgba(212,168,67,0.5)'}
              onBlur={e=>e.target.style.borderColor='rgba(255,255,255,0.1)'}
            />
            {query && (

                color:'rgba(255,255,255,0.3)',fontSize:16,cursor:'pointer',padding:4,

            )}
          </div>
          {/* Search */}
          <button
            onClick={()=>doSearch()}
            disabled={loading||!query.trim()}
            style={{
              minHeight:48,padding:'0 20px',borderRadius:12,
              border:'1px solid rgba(212,168,67,0.4)',
              background:(loading||!query.trim())?'rgba(212,168,67,0.05)':'rgba(212,168,67,0.15)',
              color:(loading||!query.trim())?'rgba(212,168,67,0.35)':'#D4A843',
              fontSize:14,fontWeight:600,
              cursor:(loading||!query.trim())?'not-allowed':'pointer',
              fontFamily:'inherit',transition:'all 0.15s',whiteSpace:'nowrap',flexShrink:0,
            }}
          >{loading?'…':'搜尋'}</button>
        </div>

        {/* OCR status */}
        {ocrMsg && (
          <div style={{padding:'2px 16px 8px',fontSize:12,color:'rgba(212,168,67,0.8)',display:'flex',alignItems:'center',gap:6}}>
            <span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',border:'2px solid rgba(212,168,67,0.5)',borderTopColor:'transparent',animation:'spin 0.8s linear infinite',flexShrink:0}} />
            {ocrMsg}
          </div>
        )}

        {/* Filters */}
        <div style={{display:'flex',flexDirection:'column',gap:10,paddingBottom:10}}>
          <FilterChips label="卡種" options={TYPE_GROUPS} value={typeF} onChange={setTypeF} />
          <FilterChips label="屬性" options={attrOptions} value={attrF} onChange={setAttrF}
            colorFn={o => ATTR_VISUAL[o]?.color} />
          {searched && availableRaces.length>1 && (
            <FilterChips label="種族" options={raceOptions} value={raceF} onChange={setRaceF} />
          )}
        </div>
      </div>

      {/* ── Content ── */}
      <div style={{flex:1}}>
        {!searched && !loading && (
          <div style={{padding:'32px 16px'}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.25)',letterSpacing:'0.08em',fontWeight:600,marginBottom:10}}>熱門搜尋</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
              {suggestions.map(s=>(
                <button key={s} onClick={()=>{setQuery(s);doSearch(s);}} style={{
                  minHeight:44,padding:'0 18px',borderRadius:99,
                  border:'1px solid rgba(255,255,255,0.08)',
                  background:'rgba(255,255,255,0.04)',
                  color:'rgba(255,255,255,0.5)',
                  fontSize:14,cursor:'pointer',fontFamily:'inherit',transition:'all 0.15s',
                  display:'flex',alignItems:'center',
                }}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(212,168,67,0.4)';e.currentTarget.style.color='#D4A843';}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.08)';e.currentTarget.style.color='rgba(255,255,255,0.5)';}}
                >{s}</button>
              ))}
            </div>
          </div>
        )}

        {loading && <div>{Array.from({length:8}).map((_,i)=><SkeletonRow key={i} />)}</div>}

        {!loading && error && (
          <div style={{padding:'48px 24px',textAlign:'center',color:'rgba(255,255,255,0.3)',fontSize:14}}>{error}</div>
        )}

        {!loading && searched && !error && allCards.length>0 && (
          <div style={{
            display:'flex',alignItems:'center',justifyContent:'space-between',
            padding:'10px 16px',fontSize:11,color:'rgba(255,255,255,0.3)',
            borderBottom:'1px solid rgba(255,255,255,0.04)',
          }}>
            <span>
              共 <span style={{color:'#D4A843',fontWeight:600}}>{allCards.length}</span> 張
              {filtered.length!==allCards.length && (
                <> · 顯示 <span style={{color:'#D4A843',fontWeight:600}}>{filtered.length}</span> 張</>
              )}
            </span>
            {(typeF!=='全部'||attrF!=='全部'||raceF!=='全部') && (
              <button onClick={()=>{setTypeF('全部');setAttrF('全部');setRaceF('全部');}} style={{
                background:'transparent',border:'none',color:'rgba(212,168,67,0.6)',
                fontSize:11,cursor:'pointer',fontFamily:'inherit',padding:0,
              }}>清除篩選</button>
            )}
          </div>
        )}

        {!loading && filtered.length>0 && (
          <div>
            {filtered.map((card,i)=>(
              <CardRow key={card.id} card={card} onClick={setSheet} delay={Math.min(i*30,300)} />
            ))}
            <div style={{height:40}} />
          </div>
        )}
      </div>

      {sheet && <Sheet card={sheet} onClose={()=>setSheet(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
